[project]
name = "real2sim"
version = "0.1.0"
description = "nuScenes annotated trajectories -> OpenSCENARIO scenarios, esmini replay metrics"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
